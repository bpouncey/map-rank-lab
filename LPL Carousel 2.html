<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Pack Lab — Carousel 2 (Job Site Warning)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Space+Mono:wght@400;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1a; font-family: 'Barlow', sans-serif; }

  /* ── SHARED ── */
  .c2-slide {
    width: 1080px;
    height: 1350px;
    background: #f2ede4;
    color: #0f0f0d;
    font-family: 'Barlow', sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* Diagonal hazard stripes along the top edge */
  .c2-hazard-bar {
    width: 100%;
    height: 18px;
    background: repeating-linear-gradient(
      -55deg,
      #f5c800 0px,
      #f5c800 20px,
      #0f0f0d 20px,
      #0f0f0d 40px
    );
    flex-shrink: 0;
  }

  .c2-inner {
    width: 100%;
    height: calc(100% - 18px);
    display: flex;
    flex-direction: column;
    padding: 56px 80px 60px;
    position: relative;
    z-index: 1;
  }

  .c2-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 48px;
  }

  .c2-wordmark {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(15,15,13,0.4);
  }
  .c2-wordmark span { color: #c8a800; }

  .c2-counter {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: rgba(15,15,13,0.35);
    letter-spacing: 0.08em;
  }

  .c2-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #c8a800;
    background: #0f0f0d;
    display: inline-block;
    padding: 6px 14px;
    margin-bottom: 40px;
  }

  /* Slide 1 */
  .c2-s1-headline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 118px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #0f0f0d;
    margin-bottom: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .c2-s1-headline .highlight {
    color: #f5c800;
    background: #0f0f0d;
    display: inline;
    padding: 0 8px;
    line-height: 1.05;
  }

  .c2-s1-sub {
    font-family: 'Barlow', sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: rgba(15,15,13,0.55);
    margin-top: 36px;
    letter-spacing: 0.01em;
  }

  .c2-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 48px;
  }

  /* Slide 2 */
  .c2-body {
    font-family: 'Barlow', sans-serif;
    font-size: 30px;
    font-weight: 400;
    line-height: 1.55;
    color: rgba(15,15,13,0.75);
    margin-bottom: 48px;
    text-wrap: pretty;
  }
  .c2-body strong { color: #0f0f0d; font-weight: 700; }

  .c2-warning-box {
    border: 3px solid #0f0f0d;
    background: #f5c800;
    padding: 32px 40px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .c2-warning-icon {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 48px;
    font-weight: 900;
    color: #0f0f0d;
    line-height: 1;
    flex-shrink: 0;
  }

  .c2-warning-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: #0f0f0d;
    line-height: 1.3;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  /* Slides 3 & 4 fix items */
  .c2-fix-item {
    display: flex;
    gap: 0;
    border-top: 2px solid #0f0f0d;
    padding: 36px 0;
  }
  .c2-fix-item:last-child { border-bottom: 2px solid #0f0f0d; }

  .c2-fix-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 72px;
    font-weight: 900;
    color: #f5c800;
    background: #0f0f0d;
    width: 88px;
    height: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-right: 36px;
    margin-top: 4px;
    line-height: 1;
  }

  .c2-fix-head {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 44px;
    font-weight: 800;
    text-transform: uppercase;
    color: #0f0f0d;
    line-height: 1.1;
    letter-spacing: 0.01em;
    margin-bottom: 10px;
  }

  .c2-fix-desc {
    font-family: 'Barlow', sans-serif;
    font-size: 19px;
    font-weight: 400;
    color: rgba(15,15,13,0.5);
    line-height: 1.5;
  }

  /* Slide 5 */
  .c2-cta-headline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 124px;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 0.92;
    letter-spacing: -0.01em;
    color: #0f0f0d;
    margin-bottom: 40px;
  }

  .c2-cta-sub {
    font-size: 24px;
    font-weight: 400;
    color: rgba(15,15,13,0.6);
    line-height: 1.55;
    margin-bottom: 64px;
    max-width: 700px;
    text-wrap: pretty;
  }

  .c2-cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: #0f0f0d;
    color: #f5c800;
    padding: 26px 44px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    width: fit-content;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DCSection, DCArtboard, DesignCanvas } = window;

function C2Wordmark() {
  return <span className="c2-wordmark">Local <span>Pack</span> Lab</span>;
}

/* ── SLIDE 1 ── */
function C2S1() {
  return (
    <div className="c2-slide">
      <div className="c2-hazard-bar"></div>
      <div className="c2-inner">
        <div className="c2-topbar">
          <C2Wordmark />
          <span className="c2-counter">1 / 5</span>
        </div>

        <div style={{flex:1, display:'flex', flexDirection:'column', justifyContent:'center'}}>
          <div style={{fontFamily:"'Space Mono', monospace", fontSize:'11px', fontWeight:700, letterSpacing:'0.2em', textTransform:'uppercase', color:'rgba(15,15,13,0.35)', marginBottom:'28px'}}>
            GBP PHOTOS AUDIT
          </div>
          <div className="c2-s1-headline">
            <div>Your GBP</div>
            <div>Photos Are</div>
            <div><span className="highlight">Hurting</span></div>
            <div>You.</div>
          </div>
          <p className="c2-s1-sub">The fix takes 10 minutes — if you know what to look for</p>
        </div>

        <div className="c2-bottom">
          <div style={{display:'flex', gap:'6px'}}>
            {[1,2,3,4,5].map(n => (
              <div key={n} style={{width: n===1 ? '36px':'12px', height:'4px', background: n===1 ? '#f5c800':'rgba(15,15,13,0.15)', borderRadius:'2px'}}></div>
            ))}
          </div>
          <span style={{fontFamily:"'Space Mono', monospace", fontSize:'10px', color:'rgba(15,15,13,0.2)', letterSpacing:'0.14em', textTransform:'uppercase'}}>localpacklab.com</span>
        </div>
      </div>

      {/* bg texture number */}
      <div style={{position:'absolute', right:'-60px', bottom:'-80px', fontFamily:"'Barlow Condensed', sans-serif", fontSize:'680px', fontWeight:900, lineHeight:1, color:'rgba(15,15,13,0.04)', userSelect:'none', pointerEvents:'none', textTransform:'uppercase'}}>!</div>
    </div>
  );
}

/* ── SLIDE 2 ── */
function C2S2() {
  const stats = [
    {n:'64%', label:'of GBP clicks go to profiles with 10+ photos'},
    {n:'3×', label:'more likely to rank if photos are geotagged'},
    {n:'0', label:'contractors who read Google\'s photo guidelines'},
  ];
  return (
    <div className="c2-slide">
      <div className="c2-hazard-bar"></div>
      <div className="c2-inner">
        <div className="c2-topbar">
          <C2Wordmark />
          <span className="c2-counter">2 / 5</span>
        </div>

        <div className="c2-label">The Problem</div>

        <p className="c2-body">
          Google uses your GBP photos as <strong>quality signals.</strong> Low-res screenshots, stock photos, and logo images don't just look bad — they actively suppress your ranking.
        </p>

        <div className="c2-warning-box">
          <div className="c2-warning-icon">!</div>
          <div className="c2-warning-text">
            A blurry before/after pic tells Google you don't care about your listing
          </div>
        </div>

        <div style={{marginTop:'40px', display:'flex', flexDirection:'column', gap:'0'}}>
          {stats.map((s, i) => (
            <div key={i} style={{display:'flex', gap:'28px', alignItems:'center', padding:'20px 0', borderTop: i===0 ? '2px solid rgba(15,15,13,0.12)' : undefined, borderBottom:'2px solid rgba(15,15,13,0.12)'}}>
              <div style={{fontFamily:"'Barlow Condensed', sans-serif", fontSize:'52px', fontWeight:900, color:'#0f0f0d', width:'120px', flexShrink:0, lineHeight:1}}>{s.n}</div>
              <div style={{fontFamily:"'Barlow', sans-serif", fontSize:'18px', color:'rgba(15,15,13,0.55)', lineHeight:1.4}}>{s.label}</div>
            </div>
          ))}
        </div>

        <div className="c2-bottom" style={{marginTop:'auto'}}>
          <C2Wordmark />
          <span style={{fontFamily:"'Space Mono', monospace", fontSize:'10px', color:'rgba(15,15,13,0.2)', letterSpacing:'0.14em', textTransform:'uppercase'}}>localpacklab.com</span>
        </div>
      </div>
    </div>
  );
}

/* ── SLIDE 3 ── */
function C2S3() {
  const fixes = [
    {n:'1', head:'Delete stock and logo photos', desc:'Google can detect generic imagery. Only real job site photos count.'},
    {n:'2', head:'Shoot in landscape, not portrait', desc:'Google crops portrait shots badly in the map panel — you lose the best part.'},
  ];
  return (
    <div className="c2-slide">
      <div className="c2-hazard-bar"></div>
      <div className="c2-inner">
        <div className="c2-topbar">
          <C2Wordmark />
          <span className="c2-counter">3 / 5</span>
        </div>

        <div className="c2-label">The Fixes</div>

        <div style={{flex:1, display:'flex', flexDirection:'column', justifyContent:'center', gap:'0'}}>
          {fixes.map((fix, i) => (
            <div key={i} className="c2-fix-item">
              <div className="c2-fix-num">{fix.n}</div>
              <div>
                <div className="c2-fix-head">{fix.head}</div>
                <div className="c2-fix-desc">{fix.desc}</div>
              </div>
            </div>
          ))}

          <div style={{marginTop:'48px', display:'flex', alignItems:'center', gap:'16px', padding:'28px 32px', background:'rgba(15,15,13,0.04)', border:'1px dashed rgba(15,15,13,0.2)'}}>
            <span style={{fontFamily:"'Space Mono', monospace", fontSize:'12px', color:'rgba(15,15,13,0.3)', letterSpacing:'0.1em'}}>CONTINUED NEXT →</span>
          </div>
        </div>

        <div className="c2-bottom">
          <C2Wordmark />
          <span style={{fontFamily:"'Space Mono', monospace", fontSize:'10px', color:'rgba(15,15,13,0.2)', letterSpacing:'0.14em', textTransform:'uppercase'}}>localpacklab.com</span>
        </div>
      </div>
    </div>
  );
}

/* ── SLIDE 4 ── */
function C2S4() {
  const fixes = [
    {n:'3', head:'Geotag every photo before uploading', desc:'Use a free app to embed GPS coordinates into the EXIF data. Takes 30 seconds.'},
    {n:'4', head:'Name files with keywords', desc:'Rename before upload: "pressure-washing-driveway-austin.jpg" beats "IMG_4721.jpg"'},
    {n:'5', head:'Upload 2 photos per job, every week', desc:'Recency of photos signals active business. Most competitors upload once and stop.'},
  ];
  return (
    <div className="c2-slide">
      <div className="c2-hazard-bar"></div>
      <div className="c2-inner">
        <div className="c2-topbar">
          <C2Wordmark />
          <span className="c2-counter">4 / 5</span>
        </div>

        <div className="c2-label">The Fixes — cont.</div>

        <div style={{flex:1, display:'flex', flexDirection:'column', justifyContent:'center'}}>
          {fixes.map((fix, i) => (
            <div key={i} className="c2-fix-item">
              <div className="c2-fix-num">{fix.n}</div>
              <div>
                <div className="c2-fix-head">{fix.head}</div>
                <div className="c2-fix-desc">{fix.desc}</div>
              </div>
            </div>
          ))}
        </div>

        <div className="c2-bottom">
          <C2Wordmark />
          <span style={{fontFamily:"'Space Mono', monospace", fontSize:'10px', color:'rgba(15,15,13,0.2)', letterSpacing:'0.14em', textTransform:'uppercase'}}>localpacklab.com</span>
        </div>
      </div>
    </div>
  );
}

/* ── SLIDE 5 ── */
function C2S5() {
  return (
    <div className="c2-slide">
      <div className="c2-hazard-bar"></div>
      <div className="c2-inner">
        <div className="c2-topbar">
          <C2Wordmark />
          <span className="c2-counter">5 / 5</span>
        </div>

        <div style={{flex:1, display:'flex', flexDirection:'column', justifyContent:'center'}}>
          <div style={{fontFamily:"'Space Mono', monospace", fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', color:'rgba(15,15,13,0.3)', marginBottom:'36px'}}>
            You're 10 minutes away
          </div>
          <h2 className="c2-cta-headline">
            Get the<br/>photo<br/>checklist.
          </h2>
          <p className="c2-cta-sub">
            Every fix above, plus a naming template and free geotagging tools — laid out step by step for contractors.
          </p>
          <div className="c2-cta-btn">
            Link in bio → LPL Photo Guide <span>↗</span>
          </div>
        </div>

        <div className="c2-bottom">
          <C2Wordmark />
          <span style={{fontFamily:"'Space Mono', monospace", fontSize:'10px', color:'rgba(15,15,13,0.2)', letterSpacing:'0.14em', textTransform:'uppercase'}}>localpacklab.com</span>
        </div>
      </div>

      {/* bg stripe accent bottom right */}
      <div style={{
        position:'absolute', right:0, bottom:0,
        width:'360px', height:'360px',
        background: 'repeating-linear-gradient(-55deg, rgba(245,200,0,0.08) 0px, rgba(245,200,0,0.08) 20px, transparent 20px, transparent 40px)',
        pointerEvents:'none',
      }}></div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas title="Local Pack Lab — Carousel 2: Job Site Warning">
      <DCSection id="c2" title="GBP Photos Carousel · Cream / Hazard Yellow / Black · 1080 × 1350">
        <DCArtboard id="c2s1" label="Slide 1 — Hook" width={1080} height={1350}><C2S1 /></DCArtboard>
        <DCArtboard id="c2s2" label="Slide 2 — Problem" width={1080} height={1350}><C2S2 /></DCArtboard>
        <DCArtboard id="c2s3" label="Slide 3 — Fixes 1–2" width={1080} height={1350}><C2S3 /></DCArtboard>
        <DCArtboard id="c2s4" label="Slide 4 — Fixes 3–5" width={1080} height={1350}><C2S4 /></DCArtboard>
        <DCArtboard id="c2s5" label="Slide 5 — CTA" width={1080} height={1350}><C2S5 /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
