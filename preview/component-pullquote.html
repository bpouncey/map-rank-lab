<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0e1016; font-family: 'Space Grotesk', sans-serif; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }
  .sec-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 8px; }
</style>
</head>
<body>

<div>
  <div class="sec-label">Pullquote — Midnight Lime</div>
  <div style="border-left:4px solid #c8f135; padding:28px 36px; background:rgba(200,241,53,0.06); border-radius:0 4px 4px 0;">
    <p style="font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; color:#c8f135; line-height:1.4; font-style:italic;">"Proximity alone won't save a weak profile"</p>
  </div>
</div>

<div>
  <div class="sec-label">Pullquote — Navy Electric</div>
  <div style="border-left:4px solid #4d9fff; padding:28px 36px; background:rgba(77,159,255,0.07); border-radius:0 4px 4px 0;">
    <p style="font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; color:#4d9fff; line-height:1.4; font-style:italic;">"Proximity alone won't save a weak profile"</p>
  </div>
</div>

<div>
  <div class="sec-label">Continue Hint</div>
  <div style="padding:32px 36px; background:rgba(200,241,53,0.06); border:1px dashed rgba(200,241,53,0.2); border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
    <span style="font-family:'Space Mono',monospace; color:rgba(255,255,255,0.3); letter-spacing:0.1em; font-size:13px;">CONTINUED ON NEXT SLIDE</span>
    <span style="color:#c8f135; font-size:22px;">→</span>
  </div>
</div>

</body>
</html>
