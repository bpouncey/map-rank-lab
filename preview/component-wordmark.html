<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0e1016; font-family: 'Space Grotesk', sans-serif; padding: 28px 32px; display: flex; flex-direction: column; gap: 24px; }
  .sec-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(240,240,238,0.35); }
  .wordmark span { color: #c8f135; }
  .counter { font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: rgba(240,240,238,0.30); }
  .meta { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(240,240,238,0.20); }
</style>
</head>
<body>

<div>
  <div class="sec-label">Slide Header Row</div>
  <div class="row" style="background:rgba(255,255,255,0.03); padding:16px 20px; border-radius:4px; border:1px solid rgba(255,255,255,0.06);">
    <div class="wordmark">Local <span>Pack</span> Lab</div>
    <div class="counter">3 / 5</div>
  </div>
</div>

<div>
  <div class="sec-label">Slide Footer Row</div>
  <div class="row" style="background:rgba(255,255,255,0.03); padding:16px 20px; border-radius:4px; border:1px solid rgba(255,255,255,0.06);">
    <div class="wordmark">Local <span>Pack</span> Lab</div>
    <div class="meta">localpacklab.com</div>
  </div>
</div>

<div>
  <div class="sec-label">Progress Bars</div>
  <div style="display:flex; flex-direction:column; gap:8px; padding:16px 20px; background:rgba(255,255,255,0.03); border-radius:4px; border:1px solid rgba(255,255,255,0.06); width:fit-content;">
    <div style="width:64px; height:3px; background:#c8f135; border-radius:2px;"></div>
    <div style="width:32px; height:3px; background:rgba(255,255,255,0.15); border-radius:2px;"></div>
    <div style="width:32px; height:3px; background:rgba(255,255,255,0.15); border-radius:2px;"></div>
    <div style="width:32px; height:3px; background:rgba(255,255,255,0.15); border-radius:2px;"></div>
    <div style="width:32px; height:3px; background:rgba(255,255,255,0.15); border-radius:2px;"></div>
  </div>
</div>

<div>
  <div class="sec-label">Section Label (eyebrow)</div>
  <div style="font-family:'Space Mono',monospace; font-size:12px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:#c8f135;">The Real Problem</div>
</div>

</body>
</html>
