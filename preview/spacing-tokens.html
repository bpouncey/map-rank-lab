<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0e1016; font-family: 'Space Grotesk', sans-serif; padding: 24px; }
  .sec-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 10px; }
  .row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .space-chip { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .space-bar { background: rgba(200,241,53,0.25); border-radius: 2px; height: 16px; }
  .space-val { font-family: 'Space Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.4); }
  .radius-demo { height: 40px; width: 72px; background: rgba(200,241,53,0.15); border: 1px solid rgba(200,241,53,0.3); display: flex; align-items: center; justify-content: center; }
  .radius-val { font-family: 'Space Mono', monospace; font-size: 10px; color: rgba(200,241,53,0.7); }
  .border-demo { height: 40px; flex: 1; display: flex; align-items: center; padding: 0 14px; }
  .border-label { font-family: 'Space Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.06em; }
</style>
</head>
<body>

<div class="sec-label" style="margin-bottom:12px;">Spacing Scale</div>
<div class="row" style="align-items:flex-end; margin-bottom:24px;">
  <div class="space-chip"><div class="space-bar" style="width:4px;"></div><div class="space-val">4</div></div>
  <div class="space-chip"><div class="space-bar" style="width:8px;"></div><div class="space-val">8</div></div>
  <div class="space-chip"><div class="space-bar" style="width:12px;"></div><div class="space-val">12</div></div>
  <div class="space-chip"><div class="space-bar" style="width:16px;"></div><div class="space-val">16</div></div>
  <div class="space-chip"><div class="space-bar" style="width:20px;"></div><div class="space-val">20</div></div>
  <div class="space-chip"><div class="space-bar" style="width:24px;"></div><div class="space-val">24</div></div>
  <div class="space-chip"><div class="space-bar" style="width:32px;"></div><div class="space-val">32</div></div>
  <div class="space-chip"><div class="space-bar" style="width:40px;"></div><div class="space-val">40</div></div>
  <div class="space-chip"><div class="space-bar" style="width:48px;"></div><div class="space-val">48</div></div>
  <div class="space-chip"><div class="space-bar" style="width:56px;"></div><div class="space-val">56</div></div>
  <div class="space-chip"><div class="space-bar" style="width:64px;"></div><div class="space-val">64</div></div>
  <div class="space-chip"><div class="space-bar" style="width:72px;"></div><div class="space-val">72</div></div>
  <div class="space-chip"><div class="space-bar" style="width:80px;"></div><div class="space-val">80</div></div>
</div>

<div class="sec-label" style="margin-bottom:12px;">Corner Radius</div>
<div class="row" style="margin-bottom:24px; align-items:flex-end;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div class="radius-demo" style="border-radius:4px;"></div>
    <div class="radius-val">Sharp · 4px</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div class="radius-demo" style="border-radius:12px;"></div>
    <div class="radius-val">Soft · 12px</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div class="radius-demo" style="border-radius:24px;"></div>
    <div class="radius-val">Round · 24px</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px; margin-left:8px;">
    <div class="radius-demo" style="border-radius:0 4px 4px 0; border-left: 4px solid #c8f135;"></div>
    <div class="radius-val">Pullquote · 0 4px 4px 0</div>
  </div>
</div>

<div class="sec-label" style="margin-bottom:12px;">Borders</div>
<div class="row" style="flex-direction:column; gap:6px;">
  <div class="border-demo" style="border: 1px solid rgba(255,255,255,0.08); border-radius:4px;">
    <span class="border-label">border — rgba(white, 8%) · default divider</span>
  </div>
  <div class="border-demo" style="border: 1px solid rgba(255,255,255,0.15); border-radius:4px;">
    <span class="border-label">border-strong — rgba(white, 15%)</span>
  </div>
  <div class="border-demo" style="border-left: 4px solid #c8f135;">
    <span class="border-label" style="color:rgba(200,241,53,0.6);">border-accent — 4px solid accent</span>
  </div>
  <div class="border-demo" style="border: 1px dashed rgba(200,241,53,0.2); border-radius:4px;">
    <span class="border-label" style="color:rgba(200,241,53,0.5);">border-accent-dim — 1px dashed accent 20%</span>
  </div>
</div>

</body>
</html>
