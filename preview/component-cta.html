<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0e1016; font-family: 'Space Grotesk', sans-serif; padding: 28px 32px; display: flex; flex-direction: column; gap: 24px; }
  .sec-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 10px; }
  .cta-block {
    display: inline-flex;
    align-items: center;
    gap: 20px;
    padding: 28px 44px;
    border-radius: 4px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    width: fit-content;
  }
</style>
</head>
<body>

<div>
  <div class="sec-label">CTA Block — Midnight Lime</div>
  <div class="cta-block" style="background:#c8f135; color:#0e1016;">
    <span>Link in bio → Local Pack Lab GBP Guide</span>
    <span style="font-size:20px;">↗</span>
  </div>
</div>

<div>
  <div class="sec-label">CTA Block — Navy Electric</div>
  <div class="cta-block" style="background:#4d9fff; color:#060c24;">
    <span>Download the free checklist</span>
    <span style="font-size:20px;">↗</span>
  </div>
</div>

<div>
  <div class="sec-label">CTA Block — Charcoal Ember</div>
  <div class="cta-block" style="background:#ff6b2b; color:#13100c;">
    <span>Start the free audit</span>
    <span style="font-size:20px;">↗</span>
  </div>
</div>

<div>
  <div class="sec-label">CTA Block — Radius Variants</div>
  <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start;">
    <div class="cta-block" style="background:#c8f135; color:#0e1016; border-radius:4px; padding:18px 28px; font-size:14px;">Sharp · 4px ↗</div>
    <div class="cta-block" style="background:#c8f135; color:#0e1016; border-radius:12px; padding:18px 28px; font-size:14px;">Soft · 12px ↗</div>
    <div class="cta-block" style="background:#c8f135; color:#0e1016; border-radius:24px; padding:18px 28px; font-size:14px;">Round · 24px ↗</div>
  </div>
</div>

</body>
</html>
